{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}RDS Dashboard{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f5f6f8; color: #1c1f26; }
    header { background: #1c2733; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e3e6ea; font-size: 14px; }
    th { background: #eef1f4; font-weight: 600; }
    .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
    .badge-ok { background: #d7f5df; color: #17693a; }
    .badge-warn { background: #ffe6b3; color: #8a5300; }
    .badge-danger { background: #ffd6d6; color: #a30000; }
    .badge-muted { background: #e3e6ea; color: #555; }
    .btn { display: inline-block; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; }
    .btn-danger { background: #d33; color: #fff; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-muted { background: #e3e6ea; color: #333; }
    .row-blocking { background: #fff3f3; }
    .messages { list-style: none; padding: 0; margin: 0 0 16px; }
    .messages li { padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; transition: opacity 400ms ease, transform 400ms ease; }
    .messages li.fade-out { opacity: 0; transform: translateY(-6px); }
    .messages li button { background: none; border: none; cursor: pointer; font-size: 16px; line-height: 1; opacity: .6; padding: 0; }
    .messages .success { background: #d7f5df; color: #17693a; }
    .messages .error { background: #ffd6d6; color: #a30000; }
    .messages .warning { background: #ffe6b3; color: #8a5300; }
    code { background: #eef1f4; padding: 2px 4px; border-radius: 4px; font-size: 12px; }
    form.inline { display: inline; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 13px; }
    input[type=text], input[type=number], input[type=password] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .htmx-indicator { opacity: 0; transition: opacity 150ms ease-in; }
    .htmx-request.htmx-indicator, .htmx-request .htmx-indicator { opacity: 1; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #c7cdd6; border-top-color: #2563eb; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .table-scroll table { min-width: 640px; }
    .bulk-bar { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
    @media (max-width: 720px) {
      header { padding: 10px 14px; flex-wrap: wrap; gap: 6px; }
      main { padding: 12px; }
      .card { padding: 12px; }
      th, td { padding: 6px 8px; font-size: 13px; }
      h2 { font-size: 19px; }
      h3 { font-size: 16px; }
      .btn { padding: 7px 10px; font-size: 13px; }
      form.inline { display: block; margin-bottom: 6px; }
    }
  </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header>
    <a href="{% url 'instance-list' %}">RDS Dashboard</a>
    {% if user.is_authenticated %}
      <span>{{ user.username }} &middot; <form class="inline" method="post" action="{% url 'logout' %}" style="display:inline;">{% csrf_token %}<button type="submit" style="background:none;border:none;color:#fff;opacity:.8;cursor:pointer;font-size:inherit;text-decoration:underline;padding:0;">logout</button></form></span>
    {% endif %}
  </header>
  <main>
    {% if messages %}
      <ul class="messages" id="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}"><span>{{ message }}</span><button type="button" onclick="this.closest('li').remove()">&times;</button></li>
        {% endfor %}
      </ul>
      <script>
        setTimeout(function () {
          document.querySelectorAll('#messages li').forEach(function (li) {
            li.classList.add('fade-out');
            setTimeout(function () { li.remove(); }, 400);
          });
        }, 4000);
      </script>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
