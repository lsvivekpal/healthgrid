{% extends "monitor/base.html" %}
{% block title %}Login &middot; RDS Dashboard{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:60px auto;">
  <div style="text-align:center;margin-bottom:8px;">
    <div style="width:44px;height:44px;border-radius:12px;background:var(--brand-light);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
    </div>
    <h2 style="margin:0;">Sign in</h2>
    <p class="section-hint" style="margin-top:4px;">RDS Dashboard</p>
  </div>
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Username</label>
    <input type="text" name="username" id="id_username" required autofocus>
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" required>
    {% if form.errors %}
    <div style="display:flex;align-items:center;gap:8px;background:var(--danger-bg);color:var(--danger-fg);padding:9px 12px;border-radius:var(--radius-sm);font-size:13px;margin-top:14px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Invalid username or password.
    </div>
    {% endif %}
    <button class="btn btn-primary" type="submit" style="margin-top:18px;width:100%;justify-content:center;">Sign in</button>
  </form>
</div>
{% endblock %}
