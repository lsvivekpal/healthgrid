{% extends "monitor/base.html" %}
{% block title %}Sign in &middot; RDS Monitor{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:8vh auto 0;padding:28px;">
  <div style="text-align:center;margin-bottom:20px;">
    <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(140deg,var(--brand),#7c74ff);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 6px 18px var(--brand-ring);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
    </div>
    <h2 style="margin:0;font-size:20px;">Welcome back</h2>
    <p class="section-hint" style="margin-top:5px;">Sign in to RDS Monitor</p>
  </div>
  <form method="post">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <label for="id_username">Username</label>
    <input type="text" name="username" id="id_username" required autofocus autocomplete="username">
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" required autocomplete="current-password">
    {% if form.errors %}
    <div style="display:flex;align-items:center;gap:8px;background:var(--danger-bg);color:var(--danger-fg);border:1px solid var(--danger-border);padding:10px 12px;border-radius:var(--radius-sm);font-size:13px;margin-top:16px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Invalid username or password.
    </div>
    {% endif %}
    <button class="btn btn-primary" type="submit" style="margin-top:20px;width:100%;">Sign in</button>
  </form>
</div>
{% endblock %}
